apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nginx-daemonaset
  namespace: nginx

spec:
  selector:
    matchLabels:
      app: nginx-label

  template:
    metadata:
      name: nginx-daemon-pod
      labels:
        app: nginx-label

    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80

          volumeMounts:
            - mountPath: /var/www/html
              name: my-volume

      volumes:
        - name: my-volume
          persistentVolumeClaim:
            claimName: local-pvc
