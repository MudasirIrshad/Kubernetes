apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
    name: apache-hpa
    namespace: apache-ns

spec:
    scaleTargetRef: # WHICH THING YOU WANT TO SCALE; E.G. POD, DEPLOYMENT, STATEFULSET ETC
        kind: Deployment
        name: apache-deployment
        apiVersion: apps/v1

    minReplicas: 1
    maxReplicas: 5

    metrics:
        - type: Resource
          resource:
            name: cpu
            target:
                type: Utilization
                averageUtilization: 5
