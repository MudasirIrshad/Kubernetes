apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: nginx

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx-label

  template:
    metadata:
      labels:
        app: nginx-label

    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          resources:
          # WE DECLARE HERE THE MINIMUM RESOURCES REQUIRED
            requests:
                cpu: 100m
                memory: 128Mi
          # WE DECLARE HERE THE MAXIMUM RESOURCES A POD CAN HAVE
            limits:
                cpu: 200m
                memory: 256Mi
                    
          volumeMounts:
          - mountPath: /usr/share/nginx/html
            name: my-volume
      volumes:
      - name: my-volume
        persistentVolumeClaim:
            claimName: local-pvc
