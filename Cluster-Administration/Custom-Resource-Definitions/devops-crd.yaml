
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: devopsbatches.devops.mudasirirshad.com

spec:
  group: devops.mudasirirshad.com
  names:
    plural: devopsbatches
    singular: devopsbatch
    kind: DevOpsBatch
    shortNames:
      - junoon
      - batches
      - tws

  scope: Namespaced

  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            name:
              type: string
              description: "This is the name of the devops batch"
            duration:
              type: string
              description: "This is duration of devops batch"
            mode:
              type: string
              description: "This is the mode description"
            platform:
              type: string
              description: "This is platform description"
